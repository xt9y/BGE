[project]
name = "bge-opengl"
command = "c run"
cwd = "."
baseline_dir = "rendercheck/baselines"
headless = "auto"
renderer = "auto"
timeout_ms = 30000.0

[validation]
vulkan = false
fail_on_error = true
fail_on_warning = false

[performance]
max_gpu_ms = 5000.0
max_process_ms = 20000.0

[[test]]
name = "runtime"
capture = false
max_gpu_ms = 5000.0
max_process_ms = 20000.0

[[test]]
name = "visual"
capture = true
warmup_frames = 30
pixel_threshold = 1
max_changed_percent = 0.1
max_gpu_ms = 5000.0
max_process_ms = 20000.0
