name: Refactor optional RendererCheck

on:
  push:
    branches: [opengl-example-game-engine]
    paths: [.github/workflows/refactor-rendercheck.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor BGE OpenGL example branches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Felix"
          git config user.email "felix@xt9y.de"
          for branch in opengl-example-game-engine opengl-example-model-engine opengl-example-voxel-engine; do
            git checkout "$branch"
            python3 - <<'PY'
          from pathlib import Path
          app_path = Path('Engine/App.c')
          cmake_path = Path('Engine/CMakeLists.txt')
          app = app_path.read_text()
          cmake_path.write_text(cmake_path.read_text().replace('rendercheck_shim.c', 'App.c'))
          if '#define RENDERCHECK_AVAILABLE' not in app:
              integration = r'''

          #if defined(__has_include)
          #  if __has_include(<rendercheck/capture.h>) && __has_include(<rendercheck/metrics.h>)
          #    define RENDERCHECK_AVAILABLE 1
          #    include <rendercheck/capture.h>
          #    include <rendercheck/metrics.h>
          #  endif
          #endif
          #ifndef RENDERCHECK_AVAILABLE
          #  define RENDERCHECK_AVAILABLE 0
          #endif

          static int rendercheck_enabled(void)
          {
          #if RENDERCHECK_AVAILABLE
              return getenv("RENDERCHECK") != NULL;
          #else
              return 0;
          #endif
          }

          #if RENDERCHECK_AVAILABLE
          static GLuint g_rendercheck_gpu_query = 0;
          static int g_rendercheck_gpu_query_active = 0;
          static void rendercheck_gpu_begin(void)
          {
              if (!rendercheck_enabled()) return;
              if (!g_rendercheck_gpu_query) glGenQueries(1, &g_rendercheck_gpu_query);
              if (!g_rendercheck_gpu_query) return;
              glBeginQuery(GL_TIME_ELAPSED, g_rendercheck_gpu_query);
              g_rendercheck_gpu_query_active = 1;
          }
          static void rendercheck_gpu_end(void)
          {
              if (!g_rendercheck_gpu_query_active) return;
              glEndQuery(GL_TIME_ELAPSED);
              g_rendercheck_gpu_query_active = 0;
              GLuint64 elapsed_ns = 0;
              glGetQueryObjectui64v(g_rendercheck_gpu_query, GL_QUERY_RESULT, &elapsed_ns);
              if (rendercheck_gpu_ms((double)elapsed_ns / 1000000.0) < 0)
                  fprintf(stderr, "RendererCheck: failed to write GPU metric\n");
          }
          static void rendercheck_capture_frame(GLFWwindow* window)
          {
              if (!rendercheck_enabled() || !rendercheck_capture_requested()) return;
              int width = 0, height = 0;
              glfwGetFramebufferSize(window, &width, &height);
              if (width <= 0 || height <= 0) return;
              const size_t row_bytes = (size_t)width * 3u;
              unsigned char* pixels = (unsigned char*)malloc(row_bytes * (size_t)height);
              if (!pixels) return;
              glPixelStorei(GL_PACK_ALIGNMENT, 1);
              glReadBuffer(GL_BACK);
              glReadPixels(0, 0, width, height, GL_RGB, GL_UNSIGNED_BYTE, pixels);
              for (int y = 0; y < height / 2; ++y) {
                  unsigned char* top = pixels + (size_t)y * row_bytes;
                  unsigned char* bottom = pixels + (size_t)(height - 1 - y) * row_bytes;
                  for (size_t x = 0; x < row_bytes; ++x) {
                      const unsigned char tmp = top[x]; top[x] = bottom[x]; bottom[x] = tmp;
                  }
              }
              if (rendercheck_capture_rgb8(pixels, (uint32_t)width, (uint32_t)height, row_bytes) < 0)
                  fprintf(stderr, "RendererCheck: failed to write frame capture\n");
              free(pixels);
          }
          static void rendercheck_gpu_shutdown(void)
          {
              if (g_rendercheck_gpu_query) glDeleteQueries(1, &g_rendercheck_gpu_query);
              g_rendercheck_gpu_query = 0;
              g_rendercheck_gpu_query_active = 0;
          }
          #else
          static void rendercheck_gpu_begin(void) {}
          static void rendercheck_gpu_end(void) {}
          static void rendercheck_capture_frame(GLFWwindow* window) { (void)window; }
          static void rendercheck_gpu_shutdown(void) {}
          #endif
          '''
              app = app.replace('#include <stdlib.h>\n', '#include <stdlib.h>\n' + integration, 1)
          if 'if (rendercheck_enabled()) glfwWindowHint(GLFW_VISIBLE, GLFW_FALSE);' not in app:
              app = app.replace('    state.win = glfwCreateWindow(WIDTH, HEIGHT, TITLE, 0, 0);', '    if (rendercheck_enabled()) glfwWindowHint(GLFW_VISIBLE, GLFW_FALSE);\n\n    state.win = glfwCreateWindow(WIDTH, HEIGHT, TITLE, 0, 0);', 1)
          app = app.replace('int GL_FRAME()\n{\n', 'int GL_FRAME()\n{\n    rendercheck_gpu_begin();\n', 1)
          if 'rendercheck_capture_frame(state.win);' not in app:
              app = app.replace('    glfwSwapBuffers(state.win);', '    rendercheck_capture_frame(state.win);\n    rendercheck_gpu_end();\n    glfwSwapBuffers(state.win);', 1)
          app = app.replace('    return !glfwWindowShouldClose(state.win) && state.id != STATE_EXIT;', '    return rendercheck_enabled() ? 0 : (!glfwWindowShouldClose(state.win) && state.id != STATE_EXIT);', 1)
          start = app.find('void GL_END()'); end = app.find('double GL_GETFPS()', start)
          if start != -1 and end != -1:
              block = app[start:end].replace('    glfwTerminate();\n', '').replace('    rendercheck_gpu_shutdown();\n', '')
              needle = '    if (state.data) glDeleteProgram(state.data->program);\n'
              if needle in block:
                  block = block.replace(needle, '    rendercheck_gpu_shutdown();\n' + needle + '    glfwTerminate();\n', 1)
              app = app[:start] + block + app[end:]
          app_path.write_text(app)
          PY
            git rm --ignore-unmatch Engine/rendercheck.h Engine/rendercheck_shim.c
            git add Engine/App.c Engine/CMakeLists.txt
            if ! git diff --cached --quiet; then
              git commit -m "Simplify optional RendererCheck integration"
              git push origin "$branch"
            fi
          done
