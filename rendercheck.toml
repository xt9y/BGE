[project]
name = "bge-opengl"
command = "c run"
cwd = "."
baseline_dir = "rendercheck/baselines"

[validation]
vulkan = false
fail_on_error = true
fail_on_warning = false

[performance]
max_gpu_ms = 5000.0
max_process_ms = 20000.0

[[test]]
name = "runtime"
capture = false
max_gpu_ms = 5000.0
max_process_ms = 20000.0

[[test]]
name = "visual"
capture = true
pixel_threshold = 1
max_changed_percent = 1.0
max_gpu_ms = 5000.0
max_process_ms = 20000.0
