name: C API Baseline Validation

on:
  push:
    branches: [c-api-baseline]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux graphics headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev xorg-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libxext-dev

      - name: Build baseline C
        run: |
          git clone --depth 1 --branch new-api-baseline https://github.com/xt9y/C.git /tmp/xt9y-c
          make -C /tmp/xt9y-c

      - name: Build project without CMake
        env:
          C_INCLUDE_DIR: /tmp/xt9y-c/include
        run: /tmp/xt9y-c/build/c clean build
