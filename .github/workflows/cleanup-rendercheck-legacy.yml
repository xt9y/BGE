name: Clean legacy RendererCheck integration

on:
  push:
    branches: [opengl-example-game-engine]
    paths: [.github/workflows/cleanup-rendercheck-legacy.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove old RendererCheck paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Felix"
          git config user.email "felix@xt9y.de"
          for branch in opengl-example-game-engine opengl-example-model-engine opengl-example-voxel-engine; do
            git checkout "$branch"
            python3 - <<'PY'
          from pathlib import Path

          p = Path('Engine/App.c')
          s = p.read_text()

          # Remove the old self-contained PPM capture helper if this branch still has it.
          marker = 'static int rendercheck_capture_frame(void)'
          start = s.find(marker)
          if start != -1:
              brace = s.find('{', start)
              depth = 0
              end = None
              for i in range(brace, len(s)):
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('could not locate end of legacy rendercheck_capture_frame')
              while end < len(s) and s[end] in '\r\n':
                  end += 1
              s = s[:start] + s[end:]

          s = s.replace('    if (getenv("RENDERCHECK")) glfwWindowHint(GLFW_VISIBLE, GLFW_FALSE);\n', '')
          s = s.replace('    const int rendercheck = getenv("RENDERCHECK") != NULL;\n    if (rendercheck && rendercheck_capture_frame() != 0)\n        fprintf(stderr, "BGE: failed to write RendererCheck frame capture\\n");\n\n', '')
          s = s.replace('    if (rendercheck) return 0;\n', '')

          p.write_text(s)
          PY
            git add Engine/App.c
            if ! git diff --cached --quiet; then
              git commit -m "Remove legacy RendererCheck integration"
              git push origin "$branch"
            fi
          done
